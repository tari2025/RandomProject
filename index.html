<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cute Puppy 🐶</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", cursive;
        background: linear-gradient(135deg, #ffe0ec, #f5dfff, #fff1d6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: #865477;
      }

      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.75);
        padding: 40px 30px;
        border-radius: 35px;
        width: 90%;
        max-width: 450px;
        box-shadow: 0 15px 40px #dba9ce55;
        position: relative;
        z-index: 2;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #b47b9f;
        margin-bottom: 25px;
      }

      .dog {
        font-size: 130px;
        display: inline-block;
        animation: bounce 1.5s infinite ease-in-out;
        cursor: pointer;
        filter: drop-shadow(0 10px 5px #d6a5bd55);
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0) rotate(-5deg);
        }
        50% {
          transform: translateY(-20px) rotate(5deg);
        }
      }

      .heart {
        position: fixed;
        font-size: 25px;
        animation: float 4s linear infinite;
        pointer-events: none;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) scale(0.5);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) scale(1.4);
          opacity: 0;
        }
      }

      .message {
        font-size: 17px;
        margin: 20px 0;
        min-height: 28px;
      }

      button {
        background: #f49bc2;
        border: none;
        padding: 13px 25px;
        border-radius: 30px;
        color: white;
        font-size: 16px;
        font-family: inherit;
        cursor: pointer;
        margin: 5px;
        transition: 0.3s;
        box-shadow: 0 5px 12px #edb1d2;
      }

      button:hover {
        background: #dc78aa;
        transform: scale(1.08);
      }

      .name {
        margin-top: 25px;
        font-size: 13px;
        color: #c08ba9;
      }

      .sparkle {
        position: absolute;
        font-size: 25px;
        animation: twinkle 2s infinite alternate;
      }

      @keyframes twinkle {
        from {
          opacity: 0.3;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1.3);
        }
      }
    </style>
  </head>

  <body>
    <div class="sparkle" style="top: 10%; left: 10%">✨</div>
    <div class="sparkle" style="top: 20%; right: 12%">⭐</div>
    <div class="sparkle" style="bottom: 15%; left: 12%">💗</div>
    <div class="sparkle" style="bottom: 12%; right: 10%">✨</div>

    <div class="container">
      <h1>My Cute Puppy 🐶</h1>

      <p class="subtitle">Welcome to my little puppy world 💕</p>

      <div class="dog" id="dog" onclick="play()">🐶</div>

      <div class="message" id="message">
        Halo! Aku anjing kecil yang lucu! 🥺
      </div>

      <button onclick="feed()">🍖 Beri Makan</button>

      <button onclick="play()">🎾 Ajak Main</button>

      <button onclick="love()">💗 Sayang Aku</button>

      <p class="name">Made with love ♡ My Little Puppy</p>
    </div>

    <script>
      const messages = [
        "Guk guk! Halo manusia! 🐶",
        "Aku senang sekali! 💕",
        "Jangan lupa sayang aku ya! 🥺",
        "Aku mau bermain lagi! 🎾",
        "Kamu baik sekali! 💗",
      ];

      function play() {
        document.getElementById("message").innerHTML =
          "Yeay! Aku senang diajak main! 🎾🐕";

        document.getElementById("dog").style.transform =
          "rotate(15deg) scale(1.2)";

        setTimeout(() => {
          document.getElementById("dog").style.transform = "";
        }, 500);
      }

      function feed() {
        document.getElementById("message").innerHTML =
          "Nyam nyam! Makanan favoritku! 🍖😋";

        createHeart("🍖");
      }

      function love() {
        document.getElementById("message").innerHTML =
          "Awww! Aku sayang kamu juga! 💗🐶";

        for (let i = 0; i < 8; i++) {
          createHeart("💗");
        }
      }

      function createHeart(symbol) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = symbol;

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = 3 + Math.random() * 3 + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
      }

      // Animasi hati otomatis
      setInterval(() => {
        createHeart("💕");
      }, 1800);
    </script>
  </body>
</html>
